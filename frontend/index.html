<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="icon" type="image/png" href="./images/wallet.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-body text-body">




  <!-- Navbar -->
  <nav class="navbar bg-body-tertiary mb-4 shadow-sm">
    <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1">Expense Tracker - Osama Almaani</span>
      <div class="btn-group btn-group-sm ms-auto" role="group" aria-label="Theme toggle">
        <button type="button" id="theme-dark-btn" class="btn btn-secondary active">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button type="button" id="theme-light-btn" class="btn btn-outline-secondary">
          <i class="fa-solid fa-sun text-warning"></i>
        </button>
      </div>
    </div>
  </nav>

  <main>
    <div class="container-fluid px-4">

      <!-- Global Error Alert -->
      <div id="error-container" class="mb-3"></div>

      <!-- Summary Cards Row -->
      <div class="summary-grid mb-4">
        <!-- Total Amount Box -->
        <div class="summary-card text-center text-md-start p-3 rounded-4">
          <h6 class="text-secondary fs-5">Total Amount</h6>
          <h2 id="total-amount">—</h2>
          <p class="text-muted mb-0">All time</p>
        </div>

        <!-- Number of Expenses Box -->
        <div class="summary-card text-center text-md-start p-3 rounded-4">
          <h6 class="text-secondary fs-5">Number of Expenses</h6>
          <h2 id="expense-count">—</h2>
          <p class="text-muted mb-0">All time</p>
        </div>

        <!-- Highest Epense Box -->
        <div class="summary-card text-center text-md-start p-3 rounded-4">
          <h6 class="text-secondary fs-5">Highest Expense</h6>
          <h2 id="highest-expense">—</h2>
          <p id="highest-expense-subtitle" class="text-muted text-capitalize mb-0">No data</p>
        </div>
      </div>

      <!-- Main Content Row -->
      <div class="row">
        <!-- Left Column: Add Expense Form -->
        <div class="col-lg-4 mb-4">
          <div class="form-container p-4 rounded-4">
            <h4 class="mb-4">Add New Expense</h4>
            <form id="expense-form">
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" class="form-control" placeholder="Enter title name" required>
              </div>
              <div class="mb-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" id="amount" class="form-control" placeholder="Amount must be greater than 0"
                  min="1" required>
              </div>
              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select name="category-select" id="category-select" class="form-select" required>
                  <option value="" selected disabled>Choose a category</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" name="date" id="date" class="form-control" required>
              </div>
              <button id="submit-btn" type="submit" class="btn btn-primary mt-2">Add Expense</button>
            </form>
          </div>
        </div>

        <!-- Right Column: Table Expenses -->
        <div class="col-lg-8">
          <div class="table-container p-4 rounded-4 ">

            <!-- The search bar and the Filters and csv file Button above the table -->
            <div class="mb-5">

              <div
                class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
                <h5 class="mb-0">Expenses</h5>

                <div
                  class="d-flex flex-column flex-md-row justify-content-start align-items-start align-items-md-center gap-3">

                  <!-- Search Bar -->
                  <input type="text" id="search-input" class="form-control form-control-sm"
                    placeholder="Search titles...">

                  <!-- Category Filter -->
                  <div class="d-flex align-items-center gap-2">
                    <label for="filter-category" class="form-label mb-0 text-nowrap">Category Filter</label>
                    <select id="filter-category" class="form-select form-select-sm w-auto">
                      <option value="All">All</option>
                      <option value="Food">Food</option>
                      <option value="Transport">Transport</option>
                      <option value="Bills">Bills</option>
                      <option value="Entertainment">Entertainment</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                  <!-- Month Filter -->
                  <div class="d-flex align-items-center gap-2">
                    <label for="filter-month" class="form-label mb-0 text-nowrap">Month</label>
                    <select id="filter-month" class="form-select form-select-sm w-auto">
                      <option value="All">All</option>
                      <option value="-01-">Jan</option>
                      <option value="-02-">Feb</option>
                      <option value="-03-">Mar</option>
                      <option value="-04-">Apr</option>
                      <option value="-05-">May</option>
                      <option value="-06-">Jun</option>
                      <option value="-07-">Jul</option>
                      <option value="-08-">Aug</option>
                      <option value="-09-">Sep</option>
                      <option value="-10-">Oct</option>
                      <option value="-11-">Nov</option>
                      <option value="-12-">Dec</option>
                    </select>
                  </div>

                  <!-- CSV Files Export Button -->
                  <button id="export-csv-btn" class="btn btn-sm btn-outline-success">
                    <i class="fa-solid fa-file-csv"></i> Export
                  </button>
                </div>
              </div>

              <!-- Clear Filters Button -->
              <div class="d-flex justify-content-end mt-2">
                <button id="clear-filters-btn" class="btn btn-sm btn-outline-danger invisible mt-1">
                  Clear Filters
                </button>
              </div>

            </div>

            <!-- Table Expenses -->
            <div class="table-responsive">
              <table class="table table-hover align-middle text-nowrap table-borderless bg-transparent">
                <thead id="table-header">
                  <tr>
                    <th class="sort-header" data-column="title">Title</th>
                    <th class="sort-header" data-column="amount">Amount</th>
                    <th class="sort-header" data-column="category">Category</th>
                    <th class="sort-header" data-column="date">Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="expense-table-body">
                </tbody>
              </table>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>



  <!-- Confirm check for deleting the expense -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">Confirm Deletion</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete this expense?
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Form to update the expense -->
  <div class="modal fade" id="updateModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">Confirm The Updates</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="edit-expense-form">
            <div class="mb-3">
              <label for="edit-title" class="form-label">Title</label>
              <input type="text" id="edit-title" class="form-control" placeholder="Enter title name" required>
            </div>
            <div class="mb-3">
              <label for="edit-amount" class="form-label">Amount</label>
              <input type="number" id="edit-amount" class="form-control" placeholder="Amount must be greater than 0"
                min="1" required>
            </div>
            <div class="mb-3">
              <label for="edit-category" class="form-label">Category</label>
              <select name="category-select" id="edit-category" class="form-select" required>
                <option value="" selected disabled>Choose a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="edit-date" class="form-label">Date</label>
              <input type="date" name="date" id="edit-date" class="form-control" required>
            </div>
          </form>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-info" id="confirm-update-btn">Update</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
